[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphlift"
version = "0.1.0"
description = "Does your graph actually help? An audit for graph machine learning datasets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rhys Miranda", email = "rhysdmiranda@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]
keywords = ["graph neural networks", "benchmark", "fraud detection", "evaluation", "data leakage"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
graphlift = "graphlift.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["graphlift*"]
