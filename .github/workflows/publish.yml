name: publish

# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted
# publishing, so no API token is stored anywhere. One-off setup on pypi.org:
# Account -> Publishing -> add a pending publisher for project "graphlift",
# owner "RhysMiranda", repository "graphlift", workflow "publish.yml",
# environment "pypi".

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
